name: CI

# Bulletproof gate: every push / PR must pass typecheck, lint, and the FULL test suite WITH the
# Postgres conformance run (RUN_DB_CONFORMANCE=1). The memory store alone hid a real Postgres bug
# (AND-vs-OR full-text recall, A-7); running the real DB path here means that class of regression
# can never merge again. See CLAUDE.md §H1.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agabi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agabi_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/agabi_test
      RUN_DB_CONFORMANCE: "1" # THE gate — runs the Postgres store against the real DB
      # Boot guards in src/env.ts expect these; CI values, not secrets.
      AUTH_MODE: dev
      AUTH_SECRET: ci-not-a-secret-conformance-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (respects .npmrc legacy-peer-deps)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enable pg_trgm (search rung 3 needs it)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d agabi_test -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Push knowledge schema to the test DB
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests + Postgres conformance
        run: npx vitest run
