# SonarQube / SonarCloud config. Enable in CI by adding a SONAR_TOKEN repo secret (and SONAR_HOST_URL
# if you self-host SonarQube Community instead of using SonarCloud). See the `sonarqube` job in
# .github/workflows/ci.yml. Until the token is set, the CI job skips cleanly.
sonar.projectKey=sidhutanveer19-code_agabi
sonar.organization=sidhutanveer19-code

sonar.sources=src,contract,scripts
sonar.tests=e2e
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.exclusions=node_modules/**,.next/**,coverage/**,**/*.d.ts,e2e/**/*-snapshots/**

# TypeScript project resolution + JS/TS analysis
sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8

# Coverage (optional): produce coverage/lcov.info via `vitest run --coverage` to light up the metric.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
